<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="astroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cosmic Icon Symbol -->
  <g transform="translate(10, 6)">
    <!-- Central Celestial Body -->
    <circle cx="24" cy="24" r="13" fill="url(#astroGrad)" filter="url(#glow)"/>
    
    <!-- Atmospheric Ring -->
    <ellipse cx="24" cy="24" rx="22" ry="7" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-28 24 24)"/>
    
    <!-- Orbiting Satellite/Moon -->
    <circle cx="41" cy="15" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="7" cy="33" r="2" fill="#c084fc"/>
    
    <!-- Pulsar Star Glints -->
    <path d="M24 6 L25 10 L29 11 L25 12 L24 16 L23 12 L19 11 L23 10 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="36" cy="36" r="1" fill="#ffffff"/>
    <circle cx="12" cy="12" r="1" fill="#ffffff"/>
  </g>

  <!-- Typography: ASTROVISTA -->
  <text x="68" y="34" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-weight="800" font-size="24" letter-spacing="1.5" fill="#f8fafc">
    ASTRO<tspan fill="#38bdf8">VISTA</tspan>
  </text>
  <text x="70" y="48" font-family="'Inter', sans-serif" font-weight="500" font-size="8.5" letter-spacing="3" fill="#94a3b8">
    OBSERVATION PLATFORM
  </text>
</svg>
